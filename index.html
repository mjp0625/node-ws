<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>守护地球 - 绿色家园</title>
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            line-height: 1.6;
            color: #333;
            background-color: #f9fdf9;
        }

        /* 导航栏 */
        header {
            background-color: #2d5a27;
            color: white;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #a8e063;
        }

        /* 英雄海报区 */
        .hero {
            height: 60vh;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), 
                        url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?ixlib=rb-1.2.1&auto=format&fit=crop&w=1351&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 600px;
        }

        /* 内容板块 */
        .container {
            max-width: 1100px;
            margin: 3rem auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 3rem;
            color: #2d5a27;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card i {
            font-size: 3rem;
            color: #4caf50;
            margin-bottom: 1rem;
        }

        /* 行动呼吁 */
        .cta {
            background-color: #e8f5e9;
            padding: 4rem 20px;
            text-align: center;
            border-radius: 15px;
            margin: 4rem 0;
        }

        .btn {
            display: inline-block;
            background-color: #4caf50;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            margin-top: 20px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #388e3c;
        }

        /* 页脚 */
        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 2rem 0;
            margin-top: 4rem;
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🌿 绿色地球项目</div>
        <nav>
            <a href="#about">关于</a>
            <a href="#actions">行动</a>
            <a href="#contact">联系我们</a>
        </nav>
    </header>

    <section class="hero">
        <h1>保护环境，从我做起</h1>
        <p>地球不是我们从祖先那里继承来的，而是我们从子孙后代那里借来的。</p>
    </section>

    <div class="container">
        <div id="about" class="section-title">
            <h2>为什么我们要保护环境？</h2>
            <p>人类的生存与自然生态系统息息相关。</p>
        </div>

        <div class="features">
            <div class="card">
                <h3>减少污染</h3>
                <p>通过减少塑料使用和正确进行垃圾分类，我们可以保护海洋和土地不受毒素侵害。</p>
            </div>
            <div class="card">
                <h3>节约能源</h3>
                <p>随手关灯、使用节能电器，不仅能降低电费，更能减少温室气体排放。</p>
            </div>
            <div class="card">
                <h3>保护生物多样性</h3>
                <p>保护森林和自然栖息地，就是保护地球上数百万种珍贵的生命形式。</p>
            </div>
        </div>

        <section id="actions" class="cta">
            <h2>准备好加入我们了吗？</h2>
            <p>每一点小小的改变，汇聚起来就是改变世界的力量。</p>
            <a href="#" class="btn">立即加入志愿者</a>
        </section>
    </div>

    <footer id="contact">
        <p>&copy; 2025 绿色地球环境保护组织 | 倡导绿色生活</p>
    </footer>

</body>
</html>
